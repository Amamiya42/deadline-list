<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>deadline清单</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div id="panel" class="panel">

    <!-- 折叠横幅模式 -->
    <div id="banner" class="banner" title="拖动移动位置，点 ⤢ 展开面板">
      <span class="banner-icon">📌</span>
      <div class="banner-text">
        <div id="bannerLabel" class="banner-label">最紧迫的未完成任务</div>
        <div id="bannerName" class="banner-name">deadline清单</div>
        <div id="bannerCd" class="banner-cd">—</div>
      </div>
      <button id="bannerExpand" class="icon-btn banner-hide banner-expand" title="展开面板">⤢</button>
      <button id="bannerHide" class="icon-btn banner-hide" title="隐藏到托盘">×</button>
    </div>

    <!-- 完整面板模式 -->
    <div id="panelMain" class="panel-main">
      <header class="header">
        <span class="title">📌 deadline清单</span>
        <span class="header-btns">
          <button id="btnCollapse" class="icon-btn" title="折叠成横幅">—</button>
          <button id="btnHide" class="icon-btn" title="隐藏到托盘（托盘图标可唤回）">×</button>
        </span>
      </header>

      <div class="section-title add-task-title">添加任务</div>
      <div class="add-form">
        <div class="input-wrap">
          <input id="inpName" type="text" placeholder="任务名，如：交高数作业" maxlength="500">
          <span id="nameCounter" class="name-counter">剩余 500 字</span>
        </div>
        <div class="form-row">
          <span class="input-label">截止时间：</span>
          <input id="inpDeadline" type="datetime-local" step="60">
        </div>
        <input id="inpNotes" type="text" placeholder="备注（选填）" maxlength="120">
        <div class="form-btns">
          <button id="btnSubmit" class="btn primary">添加任务</button>
          <button id="btnCancel" class="btn" style="display:none">取消编辑</button>
        </div>
      </div>

      <div class="section-title task-list-title">待办任务</div>
      <div id="taskList" class="task-list"></div>

      <div id="subtaskSection" class="subtask-section" style="display:none">
        <div class="section-title">子任务</div>
        <div id="subtaskList" class="subtask-list"></div>
        <button id="btnAddSubtask" class="btn small">+ 添加子任务</button>
      </div>

      <div id="doneSection" class="done-section" style="display:none">
        <button id="doneToggle" class="done-toggle">
          <span id="doneCount">0</span> 已完成 <span id="doneArrow" class="arrow">▸</span>
        </button>
        <div id="doneList" class="done-list" style="display:none"></div>
      </div>

      <footer class="hint-bar" title="专注模式：一键隐藏/恢复全部悬浮窗（托盘菜单也可切换）">
        <span class="hint-key">Ctrl</span>+<span class="hint-key">Alt</span>+<span class="hint-key">H</span>
        <span class="hint-text">专注模式 · 一键隐藏/恢复全部悬浮窗</span>
      </footer>
    </div>

    <div id="undoBar" class="undo-bar" style="display:none">
      <span id="undoText"></span>
      <button id="btnUndo" class="btn small">撤销</button>
    </div>
  </div>

  <div id="ctxMenu" class="ctx-menu" style="display:none">
    <button data-action="add-sub">添加子任务</button>
    <button data-action="edit">编辑</button>
    <button data-action="toggle-note">撕成桌面便签</button>
    <button data-action="complete">标记完成</button>
    <button data-action="delete">删除</button>
  </div>

  <div id="subtaskModal" class="modal" style="display:none">
    <div class="modal-box">
      <div class="modal-title">添加子任务</div>
      <input id="subtaskName" type="text" placeholder="子任务名" maxlength="500">
      <input id="subtaskDeadline" type="datetime-local" step="60">
      <div class="modal-btns">
        <button id="btnSubtaskOk" class="btn primary">添加</button>
        <button id="btnSubtaskCancel" class="btn">取消</button>
      </div>
    </div>
  </div>

  <script src="common.js"></script>
  <script src="panel.js"></script>
</body>
</html>
